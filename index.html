<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visualiseur Markdown</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #fbfaf8;
    --panel: #ffffff;
    --text: #262220;
    --text-muted: #7a7168;
    --border: #e6e1da;
    --accent: #a8542f;
    --accent-soft: #f3e6dd;
    --code-bg: #f4f1ec;
    --shadow: 0 1px 3px rgba(38,34,32,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1917;
      --panel: #242019;
      --text: #ede7e0;
      --text-muted: #a89e93;
      --border: #3a342c;
      --accent: #e0995f;
      --accent-soft: #3a2c1f;
      --code-bg: #2a251f;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1917;
    --panel: #242019;
    --text: #ede7e0;
    --text-muted: #a89e93;
    --border: #3a342c;
    --accent: #e0995f;
    --accent-soft: #3a2c1f;
    --code-bg: #2a251f;
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 18px calc(14px + env(safe-area-inset-top, 0px)) 18px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    margin-right: auto;
    letter-spacing: -0.01em;
  }
  header .file-name {
    font-size: 13px;
    color: var(--text-muted);
    max-width: 40vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .btn {
    font-size: 13px;
    font-weight: 500;
    padding: 7px 13px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn.primary:hover { opacity: 0.9; }
  input[type="file"] { display: none; }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
  }

  #dropzone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    cursor: pointer;
  }
  #dropzone.drag-over {
    background: var(--accent-soft);
  }
  #dropzone-inner {
    max-width: 380px;
  }
  #dropzone-inner .icon {
    font-size: 40px;
    margin-bottom: 12px;
  }
  #dropzone-inner p { margin: 4px 0; font-size: 14px; }
  #dropzone-inner .hint { font-size: 12px; }

  #viewer {
    display: none;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #viewer.active { display: block; }

  .content-wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 24px 60px 24px;
  }

  /* Markdown typography */
  .content-wrap h1, .content-wrap h2, .content-wrap h3,
  .content-wrap h4, .content-wrap h5, .content-wrap h6 {
    font-weight: 600;
    line-height: 1.3;
    margin-top: 1.6em;
    margin-bottom: 0.5em;
    letter-spacing: -0.01em;
  }
  .content-wrap h1 { font-size: 1.9em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; margin-top: 0; }
  .content-wrap h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.25em; }
  .content-wrap h3 { font-size: 1.25em; }
  .content-wrap h4 { font-size: 1.05em; }
  .content-wrap p, .content-wrap ul, .content-wrap ol, .content-wrap blockquote, .content-wrap table {
    line-height: 1.7;
    font-size: 15.5px;
    margin: 0.9em 0;
  }
  .content-wrap ul, .content-wrap ol { padding-left: 1.4em; }
  .content-wrap li { margin: 0.3em 0; }
  .content-wrap a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .content-wrap a:hover { border-bottom-color: var(--accent); }
  .content-wrap blockquote {
    margin-left: 0;
    padding: 2px 16px;
    border-left: 3px solid var(--accent);
    color: var(--text-muted);
    background: var(--accent-soft);
    border-radius: 0 6px 6px 0;
  }
  .content-wrap code {
    background: var(--code-bg);
    padding: 0.15em 0.4em;
    border-radius: 4px;
    font-size: 0.88em;
    font-family: "SF Mono", Consolas, Monaco, monospace;
  }
  .content-wrap pre {
    background: var(--code-bg);
    padding: 14px 16px;
    border-radius: 8px;
    overflow-x: auto;
    border: 1px solid var(--border);
  }
  .content-wrap pre code { background: none; padding: 0; font-size: 0.85em; }
  .content-wrap img { max-width: 100%; border-radius: 6px; }
  .content-wrap hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  .content-wrap table {
    border-collapse: collapse;
    width: 100%;
    display: block;
    overflow-x: auto;
  }
  .content-wrap th, .content-wrap td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }
  .content-wrap th { background: var(--code-bg); font-weight: 600; }
  .content-wrap input[type="checkbox"] { margin-right: 6px; }
</style>
</head>
<body>

<header>
  <h1>📄 Visualiseur Markdown</h1>
  <span class="file-name" id="fileName"></span>
  <button class="btn" id="btnNew">Nouveau fichier</button>
  <button class="btn primary" id="btnOpen">Ouvrir un fichier</button>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt">
</header>

<main>
  <div id="dropzone">
    <div id="dropzone-inner">
      <div class="icon">📝</div>
      <p><strong>Glissez un fichier .md ici</strong></p>
      <p class="hint">ou cliquez pour parcourir vos fichiers</p>
    </div>
  </div>
  <div id="viewer"><div class="content-wrap" id="content"></div></div>
</main>

<script>
  marked.setOptions({
    breaks: true,
    gfm: true,
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
      }
      return hljs.highlightAuto(code).value;
    }
  });

  const dropzone = document.getElementById('dropzone');
  const viewer = document.getElementById('viewer');
  const content = document.getElementById('content');
  const fileInput = document.getElementById('fileInput');
  const fileNameLabel = document.getElementById('fileName');
  const btnOpen = document.getElementById('btnOpen');
  const btnNew = document.getElementById('btnNew');

  function renderMarkdown(text, name) {
    try {
      content.innerHTML = marked.parse(text);
    } catch (e) {
      content.innerHTML = '<p style="color:#c0392b;">Erreur lors de l\'analyse du fichier Markdown.</p>';
    }
    dropzone.style.display = 'none';
    viewer.classList.add('active');
    fileNameLabel.textContent = name || '';
  }

  function resetToDropzone() {
    viewer.classList.remove('active');
    dropzone.style.display = 'flex';
    fileNameLabel.textContent = '';
    fileInput.value = '';
  }

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => renderMarkdown(e.target.result, file.name);
    reader.onerror = () => {
      content.innerHTML = '<p style="color:#c0392b;">Impossible de lire ce fichier.</p>';
      dropzone.style.display = 'none';
      viewer.classList.add('active');
    };
    reader.readAsText(file);
  }

  dropzone.addEventListener('click', () => fileInput.click());
  btnOpen.addEventListener('click', () => fileInput.click());
  btnNew.addEventListener('click', resetToDropzone);

  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
  });

  ['dragenter', 'dragover'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add('drag-over');
    });
  });
  ['dragleave', 'drop'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove('drag-over');
    });
  });
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  // Allow dropping a file anywhere on the page, even while viewing content
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file && viewer.classList.contains('active')) handleFile(file);
  });
</script>

</body>
</html>
